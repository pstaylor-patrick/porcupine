# Start: PORCUPINE_TAILNET_IP=$(tailscale ip -4) docker compose -f caddy/compose.yaml up -d --build
name: porcupine
services:
  caddy:
    build: .
    image: porcupine-caddy:local
    network_mode: host
    restart: unless-stopped
    env_file: ${HOME}/1-areas/pst/porcupine/secrets/caddy.env
    environment:
      PORCUPINE_TAILNET_IP: ${PORCUPINE_TAILNET_IP:?set PORCUPINE_TAILNET_IP=$(tailscale ip -4)}
    volumes:
      - ./data:/data
      - ./config:/config
